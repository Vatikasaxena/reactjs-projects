name: Next.js CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-deploy:

    runs-on: self-hosted

    steps:

    - name: Checkout code
      uses: actions/checkout@v4


    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24


    - name: Install pnpm
      run: npm install -g pnpm


    - name: Install dependencies
      run: pnpm install


    - name: Build Next.js Application
      run: pnpm build


    - name: Restart PM2 Application
      shell: powershell
      run: |
        pm2 restart react-nextjs
        pm2 save
